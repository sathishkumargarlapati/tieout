name: Release

# Publishes TieOut to PyPI when a GitHub release is published.
# Uses PyPI trusted publishing: no password or API token is stored anywhere.
# One-time setup is described in docs/releasing.md.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check that the release tag matches the package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "The release tag ${GITHUB_REF_NAME} does not match the package version v${version}." >&2
            exit 1
          fi
      - name: Test
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          ruff check .
          pytest
      - name: Build
        run: |
          python -m pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/tieout/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
